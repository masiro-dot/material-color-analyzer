<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>masiro | Texture Color Analyzer Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #c9a96e; --bg: #050505; --card-bg: #121212; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #eee; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { padding: 15px 40px; background: #000; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--accent); letter-spacing: 0.1em; }

        main { flex: 1; display: flex; padding: 20px; gap: 20px; overflow: hidden; }

        /* 左側：画像プレビュー */
        .viewport-container { flex: 2; position: relative; background: #000; border: 1px dashed #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: auto; }
        #canvas { max-width: 100%; max-height: 100%; cursor: crosshair; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: none; }
        .drop-hint { color: #444; text-align: center; pointer-events: none; }

        /* 右側：解析パネル */
        .inspector { flex: 0 0 350px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); border: 1px solid #222; padding: 20px; border-radius: 8px; }
        .card h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 15px; border-left: 2px solid var(--accent); padding-left: 10px; }

        .color-display { display: flex; gap: 15px; align-items: center; }
        .swatch { width: 70px; height: 70px; border-radius: 4px; border: 1px solid #333; background: #222; flex-shrink: 0; }
        .values { flex: 1; font-family: 'Courier New', Courier, monospace; }
        .val-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; border-bottom: 1px solid #1a1a1a; padding-bottom: 2px; }
        .val-label { color: #666; font-size: 11px; }

        .btn-main { 
            background: transparent; color: var(--accent); border: 1px solid var(--accent); 
            padding: 12px; font-size: 11px; font-weight: 600; cursor: pointer; width: 100%; 
            border-radius: 4px; text-transform: uppercase; letter-spacing: 0.2em; transition: all 0.3s;
        }
        .btn-main:hover { background: var(--accent); color: #000; }
        input[type="file"] { display: none; }
        
        .copy-hint { font-size: 9px; color: #444; margin-top: 5px; text-align: right; }
    </style>
</head>
<body>

<header>
    <div class="logo">masiro <span>Texture Lab</span></div>
    <div style="display:flex; gap:10px;">
        <label class="btn-main">Load Texture<input type="file" id="fileInput" accept="image/*"></label>
    </div>
</header>

<main>
    <div class="viewport-container" id="dropZone">
        <canvas id="canvas"></canvas>
        <div class="drop-hint" id="dropHint">
            <p style="font-size: 24px; margin-bottom: 10px;">＋</p>
            <p style="font-size: 12px; letter-spacing: 0.1em;">DROP TEXTURE IMAGE HERE</p>
        </div>
    </div>

    <div class="inspector">
        <div class="card">
            <h3>Picked Point</h3>
            <div class="color-display">
                <div id="pickSwatch" class="swatch"></div>
                <div class="values">
                    <div class="val-row"><span class="val-label">RGB</span><span id="pickRGB">---, ---, ---</span></div>
                    <div class="val-row"><span class="val-label">HEX</span><span id="pickHex">#------</span></div>
                </div>
            </div>
            <p class="copy-hint">Click image to sample color</p>
        </div>

        <div class="card">
            <h3>Texture Average</h3>
            <div class="color-display">
                <div id="avgSwatch" class="swatch"></div>
                <div class="values">
                    <div class="val-row"><span class="val-label">RGB</span><span id="avgRGB">---, ---, ---</span></div>
                    <div class="val-row"><span class="val-label">HEX</span><span id="avgHex">#------</span></div>
                </div>
            </div>
            <p class="copy-hint">Calculated from entire image</p>
        </div>
        
        <div style="padding: 0 10px;">
            <p style="font-size: 10px; color: #333; line-height: 1.6;">
                建築パースのベースカラー設定や、<br>
                素材のトーン合わせにご活用ください。
            </p>
        </div>
    </div>
</main>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const dropHint = document.getElementById('dropHint');

    function loadFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                dropHint.style.display = 'none';
                canvas.style.display = 'block';
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                analyzeAverage();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    fileInput.onchange = (e) => loadFile(e.target.files[0]);

    // ドロップ対応
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = '#c9a96e'; };
    dropZone.ondragleave = () => { dropZone.style.borderColor = '#333'; };
    dropZone.ondrop = (e) => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); };

    function analyzeAverage() {
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let r = 0, g = 0, b = 0;
        for (let i = 0; i < data.length; i += 4) {
            r += data[i]; g += data[i+1]; b += data[i+2];
        }
        const count = data.length / 4;
        updateDisplay('avg', Math.round(r/count), Math.round(g/count), Math.round(b/count));
    }

    canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        const p = ctx.getImageData(x, y, 1, 1).data;
        updateDisplay('pick', p[0], p[1], p[2]);
    };

    function updateDisplay(prefix, r, g, b) {
        const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        document.getElementById(`${prefix}Swatch`).style.background = hex;
        document.getElementById(`${prefix}RGB`).textContent = `${r}, ${g}, ${b}`;
        document.getElementById(`${prefix}Hex`).textContent = hex;
    }
</script>
</body>
</html>
