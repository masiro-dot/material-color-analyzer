<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>  Texture Lab Pro (High Contrast)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Inter:wght@400;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #c9a96e; --bg: #050505; --card-bg: #121212; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #eee; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { padding: 15px 40px; background: #000; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--accent); letter-spacing: 0.1em; }

        main { flex: 1; display: flex; padding: 20px; gap: 20px; overflow: hidden; }

        .viewport-container { flex: 1.5; position: relative; background: #000; border: 1px dashed #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: auto; }
        #canvas { max-width: 100%; max-height: 100%; cursor: crosshair; box-shadow: 0 0 40px rgba(0,0,0,0.8); display: none; }
        .drop-hint { color: #444; text-align: center; pointer-events: none; }

        .inspector { flex: 0 0 450px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right: 5px; }
        .card { background: var(--card-bg); border: 1px solid #222; padding: 20px; border-radius: 8px; }
        .card h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 15px; border-left: 3px solid var(--accent); padding-left: 12px; }

        .swatch-large { width: 100%; height: 45px; border-radius: 4px; border: 1px solid #333; background: #222; margin-bottom: 15px; }
        
        .value-display { font-family: 'JetBrains Mono', monospace; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .val-block { padding-bottom: 10px; border-bottom: 1px solid #1a1a1a; }
        
        .val-label { font-size: 9px; color: var(--accent); opacity: 0.9; letter-spacing: 0.12em; display: block; margin-bottom: 6px; font-weight: 600; }
        
        .val-data { color: var(--text-main); font-weight: 600; line-height: 1.1; }
        .val-rgb { font-size: 20px; }
        .val-hex { font-size: 20px; }
        
        .btn-main { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 12px; font-size: 11px; font-weight: 600; cursor: pointer; width: 100%; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.2em; transition: 0.3s; }
        .btn-main:hover { background: var(--accent); color: #000; }
        input[type="file"] { display: none; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo"> <span>Texture Lab</span></div>
    <div style="display:flex; gap:10px;">
        <label class="btn-main">Load Texture<input type="file" id="fileInput" accept="image/*"></label>
    </div>
</header>

<main>
    <div class="viewport-container" id="dropZone">
        <canvas id="canvas"></canvas>
        <div class="drop-hint" id="dropHint">
            <p style="font-size: 32px; color: var(--accent);">＋</p>
            <p style="font-size: 11px;">DROP TEXTURE</p>
        </div>
    </div>

    <div class="inspector">
        <div class="card">
            <h3>Picked Point</h3>
            <div id="pickSwatch" class="swatch-large"></div>
            <div class="value-display">
                <div class="val-block">
                    <span class="val-label">RGB VALUE</span>
                    <div class="val-data val-rgb" id="pickRGB">---, ---, ---</div>
                </div>
                <div class="val-block">
                    <span class="val-label">HEX CODE</span>
                    <div class="val-data val-hex" id="pickHex">#------</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Texture Average</h3>
            <div id="avgSwatch" class="swatch-large"></div>
            <div class="value-display">
                <div class="val-block">
                    <span class="val-label">RGB VALUE</span>
                    <div class="val-data val-rgb" id="avgRGB">---, ---, ---</div>
                </div>
                <div class="val-block">
                    <span class="val-label">HEX CODE</span>
                    <div class="val-data val-hex" id="avgHex">#------</div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const dropHint = document.getElementById('dropHint');

    function loadFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                dropHint.style.display = 'none'; canvas.style.display = 'block';
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                analyzeAverage();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    fileInput.onchange = (e) => loadFile(e.target.files[0]);
    dropZone.ondragover = (e) => { e.preventDefault(); };
    dropZone.ondrop = (e) => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); };

    function analyzeAverage() {
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let r = 0, g = 0, b = 0;
        for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i+1]; b += data[i+2]; }
        const count = data.length / 4;
        updateDisplay('avg', Math.round(r/count), Math.round(g/count), Math.round(b/count));
    }

    canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        const p = ctx.getImageData(x, y, 1, 1).data;
        updateDisplay('pick', p[0], p[1], p[2]);
    };

    function updateDisplay(prefix, r, g, b) {
        const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        document.getElementById(`${prefix}Swatch`).style.background = hex;
        document.getElementById(`${prefix}RGB`).textContent = `${r}, ${g}, ${b}`;
        document.getElementById(`${prefix}Hex`).textContent = hex;
    }
</script>
</body>
</html>
