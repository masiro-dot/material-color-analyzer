<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>masiro | Texture Color Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #c9a96e; --bg: #0b0b0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

        header { padding: 20px 40px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--accent); letter-spacing: 0.1em; }

        main { flex: 1; display: flex; padding: 30px; gap: 30px; }

        /* 左側：画像エリア */
        .viewport { flex: 2; background: #111; border: 1px solid #333; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; }
        canvas { max-width: 100%; max-height: 100%; cursor: crosshair; }

        /* 右側：解析エリア */
        .inspector { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 4px; }
        .card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 15px; }

        .color-preview { width: 100%; height: 80px; border-radius: 4px; margin-bottom: 10px; border: 1px solid #444; }
        .value-group { display: flex; flex-direction: column; gap: 8px; font-family: monospace; }
        .value-item { display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .value-label { color: #888; font-size: 12px; }

        .btn-upload { 
            background: var(--accent); color: #000; border: none; padding: 12px; 
            font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; border-radius: 4px;
            text-transform: uppercase; letter-spacing: 0.1em;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">masiro <span>Color Analyzer</span></div>
    <label class="btn-upload">Select Texture Image<input type="file" id="fileInput" accept="image/*"></label>
</header>

<main>
    <div class="viewport" id="dropZone">
        <canvas id="canvas"></canvas>
        <p id="placeholder" style="color:#444; font-size:12px;">Drop texture image here or use button</p>
    </div>

    <div class="inspector">
        <div class="card">
            <h3>Picked Color</h3>
            <div id="pickPreview" class="color-preview" style="background: #333;"></div>
            <div class="value-group">
                <div class="value-item"><span class="value-label">RGB</span><span id="pickRGB">---, ---, ---</span></div>
                <div class="value-item"><span class="value-label">HEX</span><span id="pickHex">#------</span></div>
            </div>
            <p style="font-size:10px; color:#666; margin-top:10px;">Click on the image to pick color</p>
        </div>

        <div class="card">
            <h3>Average Texture Color</h3>
            <div id="avgPreview" class="color-preview" style="background: #333;"></div>
            <div class="value-group">
                <div class="value-item"><span class="value-label">RGB</span><span id="avgRGB">---, ---, ---</span></div>
                <div class="value-item"><span class="value-label">HEX</span><span id="avgHex">#------</span></div>
            </div>
            <p style="font-size:10px; color:#666; margin-top:10px;">Overall tone of the texture</p>
        </div>
    </div>
</main>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const placeholder = document.getElementById('placeholder');

    let img = new Image();

    fileInput.onchange = (e) => loadFile(e.target.files[0]);

    function loadFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            img.onload = () => {
                placeholder.style.display = 'none';
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                calculateAverageColor();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // 平均色の計算
    function calculateAverageColor() {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let r = 0, g = 0, b = 0;
        const count = imageData.length / 4;

        for (let i = 0; i < imageData.length; i += 4) {
            r += imageData[i];
            g += imageData[i + 1];
            b += imageData[i + 2];
        }

        r = Math.floor(r / count);
        g = Math.floor(g / count);
        b = Math.floor(b / count);

        const hex = rgbToHex(r, g, b);
        document.getElementById('avgPreview').style.background = hex;
        document.getElementById('avgRGB').textContent = `${r}, ${g}, ${b}`;
        document.getElementById('avgHex').textContent = hex.toUpperCase();
    }

    // クリック地点の色取得
    canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        const pixel = ctx.getImageData(x, y, 1, 1).data;
        const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);

        document.getElementById('pickPreview').style.background = hex;
        document.getElementById('pickRGB').textContent = `${pixel[0]}, ${pixel[1]}, ${pixel[2]}`;
        document.getElementById('pickHex').textContent = hex.toUpperCase();
    };

    function rgbToHex(r, g, b) {
        return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
</script>
</body>
</html>
